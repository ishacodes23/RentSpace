---
- name: Deploy RentSpace Application and Monitoring Stack on AWS EC2
  hosts: all
  become: yes
  vars:
    project_dir: "/home/ubuntu/RentSpace"

  tasks:
    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create shared Docker bridge network for app and monitoring
      docker_network:
        name: rentspace-network
        state: present

    - name: Start Observability Stack (Node Exporter, cAdvisor, Prometheus, Grafana)
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}/monitoring"
        files:
          - docker-compose-monitoring.yml
        state: present

    - name: Deploy RentSpace Application and MySQL Database
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        files:
          - docker-compose.yml
        state: present
        build: always

    - name: Wait for RentSpace Spring Boot Application to become healthy
      uri:
        url: "http://localhost:8080/actuator/health"
        status_code: 200
        return_content: yes
      register: app_health
      until: "app_health.status == 200 and 'UP' in app_health.content"
      retries: 15
      delay: 5

    - name: Print deployment success message
      debug:
        msg: "RentSpace application successfully deployed and reporting healthy! Actuator status: {{ app_health.json.status }}"
