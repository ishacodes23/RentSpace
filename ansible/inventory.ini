# Jenkins runs ON the EC2 instance, so Ansible deploys to the same host over a local connection.
# (No SSH key / public IP needed.)
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Optional: deploy to a different remote EC2 host instead (use: ansible-playbook -i ... -l ec2_remote)
# [ec2_remote]
# app_server ansible_host=<EC2_PUBLIC_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/rentspace-key.pem
