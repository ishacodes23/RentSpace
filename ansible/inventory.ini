# Ansible Inventory for AWS EC2 Deployment
# Replace YOUR_EC2_PUBLIC_IP with your actual EC2 public IPv4 address or DNS.
# If running Ansible locally on the EC2 instance itself (e.g. inside Jenkins), use localhost.

[ec2_remote]
app_server ansible_host=YOUR_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/rentspace-key.pem

[local]
localhost ansible_connection=local ansible_user=ubuntu
