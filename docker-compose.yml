version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rentspace-mysql
    restart: always
    environment:
      MYSQL_DATABASE: sb_rentaldb
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rentspace-network

  rentspace-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rentspace-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sb_rentaldb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      PORT: 8080
    networks:
      - rentspace-network

volumes:
  mysql_data:
    driver: local

networks:
  rentspace-network:
    name: rentspace-network
    external: true
