<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Property</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        .input-box {
            margin: 15px 0;
        }

        .input-box label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            color: white;
            margin-top: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 12px;
            color: #6c5ce7;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Add Property</h2>

    <form action="/save" method="post">

        <div class="input-box">
            <label for="name">Property Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Modern Apartment" required>
        </div>

        <div class="input-box">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g. Mumbai, Downtown" required>
        </div>

        <div class="input-box">
            <label for="price">Monthly Rent (₹)</label>
            <input type="number" id="price" name="price" placeholder="e.g. 50000" required>
        </div>

        <div class="input-box">
            <label for="image">Image Name</label>
            <input type="text" id="image" name="image" placeholder="e.g. flat.jpg">
        </div>

        <button type="submit">Save Property</button>

    </form>

    <a href="/admin" class="back">← Back to Admin</a>

</div>

</body>
</html>
