<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Property Form</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
        }

        .input-box {
            margin: 15px 0;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            color: white;
            margin-top: 10px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #6c5ce7;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h2 th:text="${property.id} != null ? 'Edit Property' : 'Add Property'"></h2>

    <form th:action="@{${property.id} != null ? '/admin/update' : '/admin/save'}" method="post">

        <!-- hidden id for edit -->
        <input type="hidden" name="id" th:value="${property.id}">

        <div class="input-box">
            <input type="text" name="name" placeholder="Property Name" th:value="${property.name}" required>
        </div>

        <div class="input-box">
            <select name="type">
                <option value="">Select Type</option>
                <option value="1BHK" th:selected="${property.type == '1BHK'}">1BHK</option>
                <option value="2BHK" th:selected="${property.type == '2BHK'}">2BHK</option>
                <option value="3BHK" th:selected="${property.type == '3BHK'}">3BHK</option>
                <option value="Villa" th:selected="${property.type == 'Villa'}">Villa</option>
                <option value="Penthouse" th:selected="${property.type == 'Penthouse'}">Penthouse</option>
            </select>
        </div>

        <div class="input-box">
            <input type="text" name="location" placeholder="Location" th:value="${property.location}" required>
        </div>

        <div class="input-box">
            <input type="number" name="price" placeholder="Price" th:value="${property.price}" required>
        </div>

        <div class="input-box">
            <input type="text" name="image" placeholder="Image name (e.g. flat.jpg)" th:value="${property.image}">
        </div>

        <button type="submit">Save</button>

    </form>

    <a href="/admin">← Back</a>

</div>

</body>
</html>
