<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .input-box {
            position: relative;
            margin: 15px 0;
        }

        .input-box input {
    width: 100%;
    padding: 12px 12px 12px 40px; /* left space for icon */
    border-radius: 10px;
    border: 1px solid #ddd;
    outline: none;
    box-sizing: border-box; /* 🔥 fixes overflow */
}

        .input-box span {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: #6c5ce7;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Edit Profile</h2>

    <form action="/update-profile" method="post">

        <input type="hidden" name="id" th:value="${user.id}">
        <input type="hidden" name="password" th:value="${user.password}">

        <!-- NAME -->
        <div class="input-box">
            <span>👤</span>
            <input type="text" name="name" th:value="${user.name}" placeholder="Name">
        </div>

        <!-- EMAIL -->
        <div class="input-box">
            <span>📧</span>
            <input type="email" name="email" th:value="${user.email}" placeholder="Email">
        </div>

        <!-- PHONE -->
        <div class="input-box">
            <span>📱</span>
            <input type="text" name="phone" th:value="${user.phone}" placeholder="Phone Number">
        </div>

        <button type="submit">Update Profile</button>

    </form>

    <a href="/profile" class="back">← Back</a>

</div>

</body>
</html>
