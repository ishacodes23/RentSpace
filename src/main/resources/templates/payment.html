<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            margin: 0 0 10px 0;
        }

        .property-info {
            background: #f5f7fb;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #6c5ce7;
        }

        .property-info p {
            margin: 5px 0;
            color: #555;
            font-size: 14px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .row:last-child {
            border-bottom: none;
            border-top: 2px solid #ddd;
            padding-top: 12px;
            font-weight: 600;
            color: #6c5ce7;
            margin-top: 15px;
        }

        .row span {
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        button.success {
            background: linear-gradient(90deg, #00b894, #55efc4);
        }

        button.success:hover {
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.3);
        }

        .total {
            margin-top: 20px;
            padding: 15px;
            background: #f5f7fb;
            border-radius: 10px;
            font-weight: 600;
            color: #333;
        }

        .total p {
            margin: 8px 0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        .total .final {
            color: #6c5ce7;
            font-size: 16px;
            border-top: 2px solid #ddd;
            padding-top: 10px;
            margin-top: 10px;
        }

        a.back {
            display: block;
            text-align: center;
            color: #6c5ce7;
            text-decoration: none;
            margin-top: 12px;
            font-size: 14px;
        }

        a.back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="card">

    <h2 th:text="${p.name}"></h2>
    
    <div class="property-info">
        <p><b>📍 Location:</b> <span th:text="${p.location}"></span></p>
        <p><b>💰 Nightly Rate:</b> ₹<span th:text="${p.price}"></span></p>
    </div>

    <!-- BOOKING DATES -->
    <div style="background: #f5f7fb; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #6c5ce7;">
        <p style="margin: 5px 0; color: #666; font-size: 14px;">
            <b>Check-In:</b> <span th:text="${startDate}"></span>
        </p>
        <p style="margin: 5px 0; color: #666; font-size: 14px;">
            <b>Check-Out:</b> <span th:text="${endDate}"></span>
        </p>
        <p style="margin: 10px 0 0 0; color: #6c5ce7; font-weight: 600; font-size: 15px;">
            📅 <span th:text="${nights}"></span> nights
        </p>
    </div>

    <!-- PRICE BREAKDOWN -->
    <div class="total">
        <p><span>Nightly Rate:</span> <span>₹<span th:text="${#numbers.formatInteger(p.price, 1)}"></span></span></p>
        <p><span>Rent (<span th:text="${nights}"></span> nights):</span> <span>₹<span id="rentDisplay"></span></span></p>
        <p><span>Security Deposit:</span> <span>₹<span id="depositDisplay"></span></span></p>
        <p><span>Maintenance:</span> <span>₹<span id="maintenanceDisplay"></span></span></p>
        <p><span>GST (5%):</span> <span>₹<span id="gstDisplay"></span></span></p>
        <p class="final"><span>Total Amount:</span> <span>₹<span id="totalDisplay"></span></span></p>
    </div>

    <!-- PAY BUTTON -->
    <form th:action="@{'/pay/' + ${p.id}}" method="post">
        <button type="submit" class="success">
            💳 Proceed to Payment
        </button>
    </form>

    <a href="/properties" class="back">← Back to Properties</a>

</div>

<script th:inline="javascript">
    const pricePerNight = [[${p.price}]];
    const nights = [[${nights}]];
    const totalPrice = [[${totalPrice}]];

    // Calculate and display breakdown
    const rentAmount = pricePerNight * nights;
    const depositAmount = pricePerNight * 2;
    const maintenanceAmount = 2000 * nights;
    const gstAmount = rentAmount * 0.05;
    const finalAmount = totalPrice;

    document.getElementById('rentDisplay').innerText = Math.round(rentAmount).toLocaleString('en-IN');
    document.getElementById('depositDisplay').innerText = Math.round(depositAmount).toLocaleString('en-IN');
    document.getElementById('maintenanceDisplay').innerText = Math.round(maintenanceAmount).toLocaleString('en-IN');
    document.getElementById('gstDisplay').innerText = Math.round(gstAmount).toLocaleString('en-IN');
    document.getElementById('totalDisplay').innerText = Math.round(finalAmount).toLocaleString('en-IN');
</script>

</body>
</html>
