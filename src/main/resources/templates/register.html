<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            padding: 20px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            margin: 0 0 25px 0;
            font-size: 26px;
        }

        .input-box {
            position: relative;
            margin: 16px 0;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .input-box input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-box input:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .input-box input::placeholder {
            color: #bbb;
        }

        .icon {
            position: absolute;
            left: 14px;
            font-size: 16px;
            pointer-events: none;
        }

        .toggle {
            position: absolute;
            right: 14px;
            cursor: pointer;
            font-size: 16px;
            user-select: none;
            pointer-events: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .error {
            color: #d63031;
            font-size: 13px;
            margin: 10px 0;
            padding: 10px;
            background: #ffe5e5;
            border-radius: 8px;
        }

        .link-group {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        a {
            display: block;
            margin-top: 12px;
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: 0.3s;
        }

        a:hover {
            color: #5f4bd1;
            text-decoration: underline;
        }

        .password-note {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Create Account</h2>

    <form action="/register" method="post" onsubmit="return validatePassword()">

        <div class="input-box">
            <span class="icon">👤</span>
            <input type="text" name="name" placeholder="Full Name" required>
        </div>

        <div class="input-box">
            <span class="icon">📧</span>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-box">
            <span class="icon">🔒</span>
            <input type="password" id="pass1" name="password" placeholder="Password" required>
            <span class="toggle" onclick="togglePass('pass1')">👁️</span>
        </div>

        <div class="input-box">
            <span class="icon">🔒</span>
            <input type="password" id="pass2" placeholder="Confirm Password" required>
            <span class="toggle" onclick="togglePass('pass2')">👁️</span>
        </div>

        <p class="password-note">Password must be at least 6 characters</p>

        <p id="error" class="error" style="display: none;"></p>

        <button type="submit">Create Account</button>

    </form>

    <div class="link-group">
        <p style="color: #999; margin: 0 0 10px 0; font-size: 13px;">Already have an account?</p>
        <a href="/login">Sign In</a>
    </div>

</div>

<script>
    function togglePass(id) {
        const field = document.getElementById(id);
        field.type = field.type === "password" ? "text" : "password";
    }

    function validatePassword() {
        const p1 = document.getElementById("pass1").value;
        const p2 = document.getElementById("pass2").value;
        const errorEl = document.getElementById("error");

        if (p1.length < 6) {
            errorEl.innerText = "❌ Password must be at least 6 characters";
            errorEl.style.display = "block";
            return false;
        }

        if (p1 !== p2) {
            errorEl.innerText = "❌ Passwords do not match";
            errorEl.style.display = "block";
            return false;
        }

        return true;
    }
</script>

</body>
</html>
